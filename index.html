<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <title>Movildrive — Coming Soon</title>
    <meta name="description" content="Una nueva forma de moverse está a punto de llegar. Descubre el próximo capítulo de Movildrive.">
    <meta property="og:title" content="Movildrive — Coming Soon">
    <meta property="og:description" content="El próximo capítulo de la movilidad. Muy pronto.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.movildrive.com/">
    <meta property="og:image" content="https://www.movildrive.com/assets/img/coming-soon/four-towers.png">
    <link rel="canonical" href="https://www.movildrive.com/">
    <link rel="icon" type="image/png" href="assets/img/coming-soon/emblem.png">
    <link rel="preload" href="assets/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/img/coming-soon/four-towers.png" as="image" fetchpriority="high">
    <link rel="stylesheet" href="assets/css/coming-soon.css">
    <script src="assets/js/coming-soon.js" defer></script>
  </head>
  <body>
    <div class="experience" id="experience">
      <div class="scene-reveal" id="scene-reveal" aria-hidden="true">
        <div class="scene" data-name="Cuatro Torres" data-caption="Madrid, desde otra perspectiva.">
          <img src="assets/img/coming-soon/four-towers.png" alt="" class="scene-image scene-image--towers" fetchpriority="high">
        </div>
        <div class="scene" data-name="La ciudad" data-caption="Diseñado para lo que viene.">
          <img src="assets/img/coming-soon/city.png" alt="" class="scene-image" decoding="async">
        </div>
        <div class="scene" data-name="El concepto" data-caption="Una visión. Una nueva dirección.">
          <img src="assets/img/coming-soon/concept.png" alt="" class="scene-image scene-image--concept" decoding="async">
        </div>
        <div class="scene" data-name="Madrid en movimiento" data-caption="El futuro tiene un punto de partida.">
          <img src="assets/img/coming-soon/kio.png" alt="" class="scene-image scene-image--kio" decoding="async">
        </div>
      </div>
      <div class="frame-shade" aria-hidden="true"></div>
      <header class="header">
        <a class="brand" href="./" aria-label="Movildrive, inicio">
          <img src="assets/img/coming-soon/emblem.png" alt="" width="64" height="64">
          <span class="brand-wordmark">MOVILDRIVE</span>
        </a>
        <div class="header-right">
          <span class="location">MADRID, ESPAÑA</span>
          <a class="contact-link" href="mailto:hola@movildrive.com">Hablemos <span aria-hidden="true">↗</span></a>
        </div>
      </header>
      <main class="hero" id="hero">
        <div class="hero-copy">
          <p class="eyebrow"><span class="status-light" aria-hidden="true"></span> EL PRÓXIMO CAPÍTULO</p>
          <h1><span>Coming</span><span class="title-second">Soon<span class="title-period">.</span></span></h1>
          <p class="hero-description">Una nueva forma de moverse.<br>Un nuevo horizonte por descubrir.</p>
        </div>
        <div class="discovery">
          <span class="discovery-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v5m0 8v5M3 12h5m8 0h5"/><circle cx="12" cy="12" r="2.5"/></svg></span>
          <p class="discovery-hint"><span class="desktop-hint">Mueve el cursor para descubrir</span><span class="touch-hint">Desliza el dedo para descubrir</span></p>
        </div>
      </main>
      <footer class="footer">
        <div class="gallery-bar" role="region" aria-label="Carrusel de imágenes de Movildrive" aria-roledescription="carrusel">
          <div class="scene-info">
            <span class="scene-count"><span id="scene-number">01</span><span class="count-divider">/</span><span class="count-total">04</span></span>
            <span class="scene-name" id="scene-name">Cuatro Torres</span>
          </div>
          <div class="gallery-controls">
            <button class="icon-button previous" id="previous" type="button" aria-label="Imagen anterior"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg></button>
            <div class="slide-selectors" role="group" aria-label="Elegir imagen">
              <button class="slide-selector" type="button" aria-label="Imagen 1: Cuatro Torres" aria-current="true" data-slide="0"><span class="selector-track"><span class="selector-progress"></span></span></button>
              <button class="slide-selector" type="button" aria-label="Imagen 2: La ciudad" data-slide="1"><span class="selector-track"><span class="selector-progress"></span></span></button>
              <button class="slide-selector" type="button" aria-label="Imagen 3: El concepto" data-slide="2"><span class="selector-track"><span class="selector-progress"></span></span></button>
              <button class="slide-selector" type="button" aria-label="Imagen 4: Madrid en movimiento" data-slide="3"><span class="selector-track"><span class="selector-progress"></span></span></button>
            </div>
            <button class="icon-button next" id="next" type="button" aria-label="Imagen siguiente"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m10 7 5 5-5 5"/></svg></button>
            <button class="icon-button pause-button" id="pause" type="button" aria-label="Pausar carrusel" aria-pressed="false"><svg class="pause-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 7v10M15 7v10"/></svg><svg class="play-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 6 9 6-9 6V6Z"/></svg></button>
          </div>
          <p class="gallery-note">EL FUTURO, A UN PASO.</p>
        </div>
        <div class="footer-bottom">
          <span>© <span id="year">2026</span> Movildrive</span>
          <span class="footer-signature">Una visión en movimiento<span class="signature-star" aria-hidden="true">✳</span></span>
        </div>
      </footer>
      <div class="cursor" id="cursor" aria-hidden="true"><span></span></div>
      <p class="sr-only" id="gallery-announcement" aria-live="polite" aria-atomic="true"></p>
      <noscript><p class="no-script">Muy pronto. Contacta con nosotros en <a href="mailto:hola@movildrive.com">hola@movildrive.com</a>.</p></noscript>
    </div>
  </body>
</html>
